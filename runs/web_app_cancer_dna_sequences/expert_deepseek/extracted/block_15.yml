apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: genomics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: genomics-api
      containers:
      - name: api-gateway
        image: genomic-platform/api-gateway:latest
        ports:
        - containerPort: 8000
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        - name: OPA_URL
          value: "http://opa:8181/v1/data/genomics/authz"
        - name: INGESTION_SERVICE_URL
          value: "http://ingestion-service:8080"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
